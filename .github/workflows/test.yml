name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the clean fixture with the composite action
        uses: ./
        with:
          path: tests/fixtures/clean_project
          fail-on: info
          sarif: clean.sarif
      - name: SARIF file exists
        run: test -s clean.sarif
      - name: The vulnerable fixture fails the build
        run: |
          if node skills/mcp-security-audit/scripts/scan.cjs tests/fixtures/vuln_project --fail-on high --quiet; then
            echo "expected a failure"; exit 1
          fi
